# Render Blueprint: Dashboard → New → Blueprint → pick this repo. Creates the app + Postgres on the free plan.
services:
  - type: web
    name: goco
    runtime: docker
    plan: free
    region: singapore
    healthCheckPath: /api/rfqs
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: goco-db
          property: connectionString
      - key: SEED_DEMO
        value: "1"

databases:
  - name: goco-db
    plan: free
    region: singapore
    databaseName: auction
    user: auction
